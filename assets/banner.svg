<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t1 { font: 700 46px 'Segoe UI', Arial, sans-serif; }
      .t2 { font: 500 22px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .t3 { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; letter-spacing: 2px; }
      .node { animation: pulse 3s ease-in-out infinite; }
      .n2 { animation-delay: .8s; } .n3 { animation-delay: 1.6s; } .n4 { animation-delay: 2.2s; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      .wing { transform-origin: center; transform-box: fill-box; animation: flap .35s ease-in-out infinite alternate; }
      @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.25); } }
      .fly { animation: drift 9s ease-in-out infinite; }
      @keyframes drift { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-40px,-18px); } 50% { transform: translate(-70px,8px); } 75% { transform: translate(-30px,20px); } }
      .ecg { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 4s linear infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#glow)"/>

  <!-- neural network motif -->
  <g stroke="#67e8f9" stroke-opacity=".25" stroke-width="1.5">
    <line x1="820" y1="70" x2="900" y2="120"/><line x1="820" y1="70" x2="900" y2="200"/>
    <line x1="820" y1="170" x2="900" y2="120"/><line x1="820" y1="170" x2="900" y2="200"/>
    <line x1="820" y1="250" x2="900" y2="200"/><line x1="900" y1="120" x2="980" y2="160"/>
    <line x1="900" y1="200" x2="980" y2="160"/>
  </g>
  <g fill="#67e8f9">
    <circle class="node" cx="820" cy="70" r="7"/><circle class="node n2" cx="820" cy="170" r="7"/>
    <circle class="node n3" cx="820" cy="250" r="7"/><circle class="node n2" cx="900" cy="120" r="8"/>
    <circle class="node n4" cx="900" cy="200" r="8"/><circle class="node n3" cx="980" cy="160" r="10"/>
  </g>

  <!-- heartbeat line (medical) -->
  <path class="ecg" d="M40 250 H300 l14 -30 l14 55 l14 -70 l14 45 H560" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- small plant -->
  <g transform="translate(1075,170)">
    <path d="M10 70 h50 l-7 45 h-36 z" fill="#c2410c"/>
    <rect x="6" y="64" width="58" height="10" rx="3" fill="#ea580c"/>
    <path d="M35 64 C35 40 30 25 18 12" stroke="#4ade80" stroke-width="3" fill="none"/>
    <path d="M35 64 C36 38 45 22 58 14" stroke="#4ade80" stroke-width="3" fill="none"/>
    <ellipse cx="18" cy="14" rx="12" ry="6" fill="#4ade80" transform="rotate(-35 18 14)"/>
    <ellipse cx="57" cy="15" rx="12" ry="6" fill="#22c55e" transform="rotate(30 57 15)"/>
    <ellipse cx="34" cy="38" rx="10" ry="5" fill="#86efac" transform="rotate(-10 34 38)"/>
    <circle cx="35" cy="6" r="7" fill="#f9a8d4"/><circle cx="35" cy="6" r="3" fill="#fde047"/>
  </g>

  <!-- butterfly -->
  <g class="fly" transform="translate(1090,70)">
    <g transform="translate(0,0)">
      <ellipse class="wing" cx="-9" cy="0" rx="10" ry="13" fill="#fbbf24"/>
      <ellipse class="wing" cx="9" cy="0" rx="10" ry="13" fill="#fb923c"/>
      <rect x="-1.5" y="-10" width="3" height="20" rx="1.5" fill="#1e293b"/>
    </g>
  </g>

  <text x="60" y="110" class="t1" fill="url(#txt)">Alireza Eram</text>
  <text x="62" y="150" class="t2">Medical Informatics · AI &amp; Chatbots · Automation</text>
  <text x="62" y="190" class="t3">TEHRAN UNIVERSITY OF MEDICAL SCIENCES · M.Sc. STUDENT</text>
</svg>
